name: Search for properties

on:
  schedule:
    # Every hour, 07:12-19:12 UTC. The script itself only runs between
    # 8am and 7pm UK time, so this covers both GMT and BST.
    - cron: "12 7-19 * * *"
  workflow_dispatch:
    inputs:
      debug:
        description: "Save raw pages to the debug-dump branch"
        type: boolean
        default: false
      notify:
        description: "Send push notifications"
        type: boolean
        default: true
      test_notification:
        description: "Also send a test push notification"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run search
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          DEBUG: ${{ inputs.debug && '1' || '0' }}
          NO_NOTIFY: ${{ (github.event_name == 'workflow_dispatch' && !inputs.notify) && '1' || '0' }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_NOTIFY: ${{ inputs.test_notification && '1' || '0' }}
        run: python -m scraper.main

      - name: Save results
        run: |
          git config user.name "house-finder-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/listings.json data/state.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update listings $(date -u +'%Y-%m-%d %H:%M') UTC"
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main && git push origin HEAD:main && break
              sleep 5
            done
          fi

      - name: Upload debug pages
        if: ${{ inputs.debug }}
        run: |
          if [ -d debug ]; then
            mv debug /tmp/debug && git stash -u || true
            git checkout --orphan debug-dump
            git rm -rf --cached . >/dev/null
            rm -rf ./* .github 2>/dev/null || true
            cp -r /tmp/debug ./debug
            git add -f debug && git commit -qm "debug dump" && git push -f origin debug-dump
          fi
